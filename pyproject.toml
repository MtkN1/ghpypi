[project]
name = "ghpypi"
version = "0.0.0"
description = "Build a PyPI-compatible package registry with GitHub Releases, GHCR, and GitHub Pages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kent Matsuura", email = "kntm2r@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "packaging>=26.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "pytest>=9.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.30",
]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest]
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src", "tests"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 100
show_missing = true
skip_covered = true
skip_empty = true
